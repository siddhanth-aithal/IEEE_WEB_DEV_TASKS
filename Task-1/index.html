<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Campus Events</h1>
    </header>
    <main>
        <!-- Create Event Section -->
        <section class="add-event-panel">
            <h2>Create Event</h2>
            <form id="event-form">
                <input type="text" id="event-title" placeholder="Event Title" required>
                <input type="date" id="event-date" required>
                <textarea id="event-desc" placeholder="Event Description" rows="3" required></textarea>
                <button type="submit">Add Event</button>
            </form>
        </section>

        <!-- View and Search Section -->
        <section class="view-events-panel">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search events by title or description...">
            </div>
            <div id="events-container" class="events-grid">
                <!-- Event cards will be injected here by JavaScript -->
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
